name: Build & Publish App Release (Windows & Android)

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "app/**"
      - "crates/shared/**"
      - "crates/mobile/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional version tag to publish (e.g. v0.2.0). Defaults to Cargo.toml version."
        required: false
        type: string

permissions:
  contents: write

jobs:
  check-release:
    name: Resolve Release Tag
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and check if release already exists
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
            echo "Triggered by tag push: ${TAG_NAME}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "${INPUT_TAG}" ]]; then
            VERSION="${INPUT_TAG#v}"
            TAG_NAME="v${VERSION}"
          else
            VERSION=$(grep -m1 '^version = "' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
            TAG_NAME="v${VERSION}"
          fi

          echo "Workspace Cargo.toml version: ${VERSION} (${TAG_NAME})"

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists. Bump version in Cargo.toml or run bun run release to publish a new version."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${TAG_NAME} detected! Proceeding to build Windows & Android releases."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

  release-windows:
    name: Build Windows Desktop App (.exe)
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Umuryango Windows Desktop App (Release)
        run: cargo build --release -p umuryango-app --bin umuryango-app

      - name: Package Windows release binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/umuryango-app.exe" "dist/umuryango-app-windows-x86_64.exe"
          $hash = (Get-FileHash "dist/umuryango-app-windows-x86_64.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  umuryango-app-windows-x86_64.exe" | Out-File -FilePath "dist/umuryango-app-windows-x86_64.exe.sha256" -Encoding utf8

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/umuryango-app-windows-x86_64.exe
            dist/umuryango-app-windows-x86_64.exe.sha256

  release-android:
    name: Build Android Mobile App (.apk)
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 27
        run: |
          sdkmanager --install "ndk;27.1.12297006" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Install Rust stable toolchain with Android arm64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build Umuryango Rust Android library (arm64-v8a)
        run: |
          cargo ndk -t arm64-v8a -o crates/mobile/android/app/src/main/jniLibs --platform 31 build --release -p umuryango-mobile
          find crates/mobile/android/app/src/main/jniLibs/arm64-v8a -type f -name "*.so" ! -name "libumuryango_mobile.so" -delete

      - name: Configure Android Keystore (if provided in repository secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/umuryango-release.jks"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/umuryango-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Assemble Android Sideload Release APK
        working-directory: crates/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleSideloadRelease \
            -PallowDebugSigning=true \
            -PappVersionName="${{ needs.check-release.outputs.version }}"

      - name: Package Android release APK
        run: |
          mkdir -p dist
          cp crates/mobile/android/app/build/outputs/apk/sideload/release/app-sideload-release.apk dist/umuryango-app-android-arm64.apk
          cd dist
          sha256sum umuryango-app-android-arm64.apk > umuryango-app-android-arm64.apk.sha256

      - name: Upload Android Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            dist/umuryango-app-android-arm64.apk
            dist/umuryango-app-android-arm64.apk.sha256

  publish-release:
    name: Publish GitHub Release (Windows + Android)
    needs:
      - check-release
      - release-windows
      - release-android
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows and Android Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-release.outputs.tag_name }}
          name: "Umuryango ${{ needs.check-release.outputs.tag_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/umuryango-app-windows-x86_64.exe
            dist/umuryango-app-windows-x86_64.exe.sha256
            dist/umuryango-app-android-arm64.apk
            dist/umuryango-app-android-arm64.apk.sha256
