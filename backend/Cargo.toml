[package]
name = "umuryango-backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "umuryango_backend"
path = "src/lib.rs"

[[bin]]
name = "umuryango-backend"
path = "src/main.rs"

[[bin]]
name = "init-schema"
path = "src/bin/init_schema.rs"

[dependencies]
actix-web = "4.20.0"
argon2 = "0.6.0"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "uuid", "migrate", "chrono"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
umuryango-shared = { path = "../crates/shared", features = ["openapi"] }
utoipa = { version = "6.0.0", features = ["actix_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["actix-web"] }
uuid.workspace = true
