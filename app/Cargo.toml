[package]
name = "umuryango-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
rune-design = ["dep:rune", "dep:rune-kit"]

[dependencies]
gpui-kit = "0.10.0"
include_dir = "0.7"
serde_json = "1"
rune = { git = "https://github.com/anomalyco/rune", rev = "27c31fc23c11f15f739af1ce22ba69e6e0aca592", optional = true }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "27c31fc23c11f15f739af1ce22ba69e6e0aca592", optional = true }
rusqlite = { version = "0.37.0", features = ["bundled"] }
umuryango-shared = { path = "../crates/shared" }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
