[workspace]
members = [
    "crates/shared",
    "crates/mobile",
    "backend",
    "app",
]
default-members = ["backend"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.5"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.3", features = ["serde", "v4"] }

[profile.dev]
incremental = true
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
